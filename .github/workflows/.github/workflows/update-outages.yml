name: Update power outages
 
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: repo-commit
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Pull county outage data from Florida Division of Emergency Management
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse, datetime, os
          BASE = "https://maps.floridadisaster.org/gis/rest/services/Events/County_Status_EEI_Current/MapServer"
          UA = {"User-Agent": "Mozilla/5.0 (hurricane dashboard; github actions)"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode("utf-8"))
          def pct_of(attrs):
              for k, v in attrs.items():
                  if re.search(r"pct|percent|perc", k, re.I) and v not in (None, "") :
                      try: return float(v)
                      except: pass
              for k, v in attrs.items():
                  if isinstance(v, str) and "%" in v and re.search(r"power|without|outage|between|less|than", v, re.I):
                      m = re.search(r"(\d+(?:\.\d+)?)\s*%", v)
                      if m: return float(m.group(1))
              return None
          def text_of(attrs):
              for v in attrs.values():
                  if isinstance(v, str) and re.search(r"without power", v, re.I): return v
              return None
          def name_of(attrs):
              for k, v in attrs.items():
                  if re.search(r"county|name", k, re.I) and isinstance(v, str) and v.strip(): return v.strip()
              return None
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          debug = {"checked": now}
          out = None
          try:
              info = get(BASE + "/layers?f=json")
              layers = info.get("layers", [])
              debug["layers"] = [{"id": l.get("id"), "name": l.get("name"), "fields": [f.get("name") for f in (l.get("fields") or [])]} for l in layers]
              lyr = next((l for l in layers if re.search(r"power|outage", l.get("name") or "", re.I)), None)
              if lyr is None:
                  raise RuntimeError("no power/outage layer found")
              q = urllib.parse.urlencode({"where": "1=1", "outFields": "*", "returnGeometry": "false", "f": "json"})
              data = get(f"{BASE}/{lyr['id']}/query?{q}")
              counties = {}
              for feat in data.get("features", []):
                  a = feat.get("attributes") or {}
                  n = name_of(a)
                  if not n: continue
                  n = re.sub(r"\s+county$", "", n, flags=re.I).strip().title()
                  counties[n] = {"pct": pct_of(a), "text": text_of(a)}
              debug["layer_used"] = lyr.get("name")
              debug["sample"] = (data.get("features") or [{}])[0].get("attributes")
              if counties:
                  out = {"source": "Florida Division of Emergency Management", "updated": now, "counties": counties}
          except Exception as e:
              debug["error"] = str(e)
          if out:
              json.dump(out, open("outages.json", "w"), indent=1)
              print("wrote", len(out["counties"]), "counties")
          else:
              print("no outage data:", debug.get("error"))
              if not os.path.exists("outages.json"):
                  json.dump({"source": None, "updated": now, "counties": {}, "error": debug.get("error")}, open("outages.json", "w"), indent=1)
          json.dump(debug, open("outages_debug.json", "w"), indent=1, default=str)
          PY
 
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add outages.json outages_debug.json
          if ! git diff --cached --quiet; then
            git commit -m "Update power outages"
            git pull --rebase origin main
            git push
          fi
